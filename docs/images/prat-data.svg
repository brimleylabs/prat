  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2750;0.3000;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><circle cx="640" cy="180" r="9" fill="#f6b73c"/><circle cx="640" cy="180" r="16" fill="#f6b73c" opacity="0.18"/><text x="640" y="164" text-anchor="middle" class="m" font-size="13" fill="#c9d2e3">views.py + test</text></g>
