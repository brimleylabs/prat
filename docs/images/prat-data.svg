  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3667;0.3917;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><circle cx="800" cy="180" r="9" fill="#f6b73c"/><circle cx="800" cy="180" r="16" fill="#f6b73c" opacity="0.18"/><text x="800" y="164" text-anchor="middle" class="m" font-size="13" fill="#c9d2e3">README</text></g>
