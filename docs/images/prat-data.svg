  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0333;0.0667;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><rect x="240" y="206" width="104" height="30" rx="15" fill="#14224a" stroke="#f6b73c"/><text x="292" y="226" text-anchor="middle" class="m" font-size="14" fill="#f6b73c">card/42</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1917;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><circle cx="430" cy="180" r="9" fill="#f6b73c"/><circle cx="430" cy="180" r="16" fill="#f6b73c" opacity="0.18"/><text x="430" y="164" text-anchor="middle" class="m" font-size="13" fill="#c9d2e3">models.py</text></g>
