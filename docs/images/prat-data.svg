<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="A card works on its own branch of the code and of the database; approval merges the data, then the code">
  <style>
    .m { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
    .t { font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
