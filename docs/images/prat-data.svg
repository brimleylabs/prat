  <rect width="1280" height="420" rx="20" fill="#0a1022"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>
  <text x="40" y="48" class="m" font-size="16" fill="#f6b73c">every card gets its own branch of your code and your data</text>
  <text x="40" y="126" class="t" font-size="18" font-weight="700" fill="#eef2f8">code</text>
