  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6083;0.6333;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><circle cx="1010" cy="322" r="11" fill="#7aa2ff"/><text x="1010" y="356" text-anchor="middle" class="m" font-size="13" fill="#c9d2e3">1 data</text></g>
  <path d="M1000 180 C 1060 180, 1050 120, 1100 120" stroke="#f6b73c" stroke-width="3.5" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100;100" keyTimes="0;0.6500;0.7167;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/></path>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7083;0.7333;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><circle cx="1100" cy="120" r="11" fill="#f6b73c"/><text x="1100" y="98" text-anchor="middle" class="m" font-size="13" fill="#c9d2e3">2 code</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5083;0.5333;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><rect x="960" y="24" width="150" height="34" rx="17" fill="#14224a" stroke="#f6b73c"/><text x="1035" y="47" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#f6b73c">you approve</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7667;0.8000;0.9500;0.9833;1" dur="12s" repeatCount="indefinite"/><rect x="1120" y="24" width="130" height="34" rx="17" fill="#15693f" fill-opacity="0.45"/><text x="1185" y="47" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#4ade80">both landed</text></g>
  <text x="640" y="392" text-anchor="middle" class="t" font-size="15" fill="#9aa6bc">main never sees a half-finished card: the data lands first, then the code, both or neither, and any landed card can be undone.</text>
