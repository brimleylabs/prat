# Development use only: `python -m alembic revision --autogenerate -m "..."`.
# PRAT itself runs migrations with `prat db upgrade`, which does not read this file.
[alembic]
script_location = src/prat/db/alembic
prepend_sys_path = src
sqlalchemy.url = sqlite:///.alembic-dev.db
file_template = %%(rev)s_%%(slug)s
