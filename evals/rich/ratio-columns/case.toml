# Rich 3a109ccdffe5 with a planted bug in rich/_ratio.py.
title = "Table columns with ratios do not fill the table"
goal = "In a table with expand=True whose columns are given ratios (for example three columns with ratio=1 each), the columns do not fill the table's width: the later columns come out too narrow and the table ends short of the width it should have."
acceptance_criteria = "- the bug described above is fixed\n- the existing tests still pass\n- a test covers the fix"
complexity = "low"
max_attempts = 3

[source]
repository = "https://github.com/Textualize/rich.git"
commit = "3a109ccdffe5b2d0e30684a304fbd388e99ce57b"

[check]
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]
timeout_seconds = 300
